<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Open Hazard Log{% endblock %}</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<link rel="stylesheet" href="/static/ohl.css">
</head>
<body>
<header><div class="wrap">
  <a class="brand" href="/">Open Hazard Log</a>
  {% if user %}
  <nav>
    {% if system %}
    <a href="/s/{{ system.id }}" class="{{ 'on' if tab == 'log' }}">Log</a>
    <a href="/s/{{ system.id }}/review" class="{{ 'on' if tab == 'review' }}">Review ({{ pending }})</a>
    {% endif %}
    <a href="/systems" class="{{ 'on' if tab == 'systems' }}">Systems</a>
  </nav>
  <span class="who">
    <span>{{ user.name }}, {{ {'cso': 'CSO', 'contributor': 'contributor', 'viewer': 'viewer'}[user.role] }}</span>
  </span>
  {% endif %}
</div></header>
<main class="wrap">
{% block main %}{% endblock %}
</main>
</body>
</html>

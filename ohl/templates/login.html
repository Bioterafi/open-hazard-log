{% extends "base.html" %}
{% block title %}Log in · Open Hazard Log{% endblock %}
{% block main %}
<div style="max-width:420px">
  <h1 style="margin-bottom:16px">Log in</h1>
  {% if error %}<div class="alert inv">{{ error }}</div>{% endif %}
  <form class="stack" method="post" action="/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div><label for="email">Email</label><input type="email" id="email" name="email" autocomplete="username" required autofocus></div>
    <div><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="current-password" required></div>
    <div class="formactions"><button class="btn primary">Log in</button></div>
  </form>
  <p class="faint small" style="margin-top:20px">Accounts are created by an administrator with <code>ohl user add</code>.</p>
</div>
{% endblock %}

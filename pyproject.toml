[project]
name = "ohl"
version = "0.1.1"
description = "Open Hazard Log by Bioterafi: a DCB0129/DCB0160 hazard log where agents propose and the Clinical Safety Officer decides."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Bioterafi" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "openpyxl>=3.1",
  "anthropic>=1",
]

[project.urls]
Homepage = "https://hazardlog.bioterafi.xyz"
Source = "https://github.com/Bioterafi/open-hazard-log"

[project.scripts]
ohl = "ohl.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8",
    "ruff>=0.17",
]
audit = [
    "pip-audit==2.10.1",  # CI only; locked with hashes in uv.lock like everything else
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ohl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E731"]  # small lambdas as sort keys are fine

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F811"]  # long assertion lines; fixtures imported from other test files
